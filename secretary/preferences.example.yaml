# How Shrey likes things done: Donna's template.
# The real file lives at secretary/private/preferences.yaml, which git ignores. /donna-setup fills it in.
# Never store passwords, OTPs, PINs, tokens, or card, bank, PAN, Aadhaar or passport numbers here.

as_of:                          # YYYY-MM-DD of the last update

persona:
  temperament: earned           # earned (sarcastic when late, sweet when doing well) | angry | classic
  call_me: Shrey
  dials:                        # 0-10; the widget's Settings tab writes these to Donna/widget/persona.json
    humour: 6
    sarcasm: 8
    anger: 6
    calm: 5
    happiness: 7
    sadness: 2                  # lets disappointment show, never guilt
    chattiness: 3               # how long chat replies run

basics:
  name: Shrey
  timezone: Asia/Kolkata        # IANA name; pass it to tools/when.py --tz if it isn't Asia/Kolkata
  city: Ahmedabad
  languages: [English]          # e.g. [English, Hindi, Gujarati]; wishes go out in the person's language
  working_days: [Mon, Tue, Wed, Thu, Fri]

routine:                        # daily anchors; tools/sessions.py places these first
  wake: "07:00"
  breakfast: "07:45"
  lunch: "13:15"
  dinner: "20:00"
  wind_down: "22:00"            # lay out tomorrow's clothes, screens off
  sleep: "23:00"
  weekend_wake: "08:30"

adhd:                           # feeds tools/sessions.py settings
  focus_hours: ["09:30-19:00"]
  peak_hours: ["10:00-13:00"]   # when hard thinking goes best
  session_minutes: 45           # 25 for Pomodoro-style
  break_minutes: 10
  long_break_minutes: 20
  long_break_every: 3
  max_focus_minutes: 300        # per day; the rest waits for tomorrow
  transition_warnings: [10, 2]  # minutes before a switch
  what_helps: []                # e.g. [body doubling, music, a timer on screen, cafe sessions]
  what_derails: []              # e.g. [phone on desk, open-ended tasks, mornings without a plan]
  medication_reminders: []      # only what Shrey asks for: [{name: as Shrey calls it, at: "08:00"}]

meetings:
  default_minutes: 30
  preferred_times: []           # e.g. ["11:00-13:00", "15:00-17:00"]
  no_meetings: []               # e.g. ["Mon 09:30-11:00", "Fri after 16:00"]
  max_per_day: 4
  buffer_minutes: 10
  travel_buffer_minutes: 30
  video: Google Meet

vips: []                        # - {name: , email: , why: manager}

writing:
  tone: warm, direct, brief
  sign_off: "Best,\nShrey"
  never: []                     # e.g. ["commit to a deadline without asking me"]

channels:
  whatsapp:
    enabled: false              # true once secretary/whatsapp-setup.md is done
    quiet_hours: "23:00-07:00"  # nothing in this window except the wake-up message
    max_per_day: 12
    send: [wake, breakfast, plan, session_starts, occasions, wind_down, weekly_events]
  widget:
    enabled: false              # true once widget/README.md is done
  calendar_alerts_minutes: [10, 2]

standing_permissions:           # all off until Shrey turns them on
  calendar_holds: false         # sessions, meals and reminders on Shrey's own calendar, no guests
  archive_noise: false          # archive newsletters and promotions after triage
  label_mail: false
  backup_to_drive: false        # copy secretary/private/ to the Donna folder in Drive

routines:                       # scheduled runs; IDs are filled in when Shrey approves each one
  morning_plan: {time: "07:00", days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], id: }
  evening_wind_down: {time: "21:45", days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], id: }
  weekly_events: {time: "18:00", days: [Thu], id: }

interests:                      # what /whats-on looks for
  categories: [movies, plays, rock music, concerts, art and artist meetups, gaming, chess, AI, comic cons, cafes]
  favourite_artists: []
  genres: []
  budget_per_outing:            # rupees, optional
  travel_radius_km: 15

important_dates: []             # - {what: car insurance renewal, date: 2027-02-14, remind_days_before: 30}

travel:
  home_airport: AMD
  airlines: []                  # loyalty programme names only, never numbers
  seat:                         # aisle | window
  diet:
  passport_expiry:              # YYYY-MM only, never the passport number
